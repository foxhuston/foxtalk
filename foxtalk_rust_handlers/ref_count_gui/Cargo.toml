[package]
name = "ref_count_gui"
version = "0.1.0"
edition = "2021"



[dependencies]
rust_tuple_reactor_serde = { path = "../../rust_tuple_reactor_serde" }
env_logger = "0.11.5"

[dependencies.winit]
default-features = false
features = ["wayland"]
version = "0.28.7"

[dependencies.eframe]
default-features = false
features = ["default_fonts", "glow", "wayland"]
version = "0.23.0"

[lib]
name = "ref_count_gui"
crate-type = ["cdylib"]
