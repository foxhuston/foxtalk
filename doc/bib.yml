degol:
  title: 'ChromaTag: A Colored Marker and Fast Detection Algorithm'
  title-short: ChromaTag
  type: conference
  author:
    - DeGol, Joseph
    - Bretl, Timothy
    - Hoiem, Derek
  abstract: >-
    Current ﬁducial marker detection algorithms rely on marker IDs for false
    positive rejection. Time is wasted on potential detections that will
    eventually be rejected as false positives. We introduce ChromaTag, a ﬁducial
    marker and detection algorithm designed to use opponent colors to limit and
    quickly reject initial false detections and grayscale for precise
    localization. Through experiments, we show that ChromaTag is signiﬁcantly
    faster than current ﬁducial markers while achieving similar or better
    detection accuracy. We also show how tag size and viewing direction effect
    detection accuracy. Our contribution is signiﬁcant because ﬁducial markers
    are often used in real-time applications (e.g. marker assisted robot
    navigation) where heavy computation is required by other parts of the
    system.
  accessed:
    - year: 2024
      month: 10
      day: 16
